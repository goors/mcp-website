apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-website
  template:
    metadata:
      labels:
        app: mcp-website
    spec:
      serviceAccountName: restricted-app-sa
      nodeSelector:
        worker-node: "true"
      imagePullSecrets:
        - name: ghsec
      containers:
        - name: app
          image: "pregmatch/shiny-flake:mcp-website-${IMAGE_TAG}"
          ports:
            - containerPort: 3000